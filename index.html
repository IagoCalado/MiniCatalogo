<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Experiência Mobile: Pinta a barra de status no tom escuro do app -->
    <meta name="theme-color" content="#090a0b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>CJ Personalizados</title>
    <meta
      name="description"
      content="Catálogo da CJ Personalizados: presentes exclusivos, papelaria personalizada e lembranças. Faça seu pedido pelo WhatsApp!"
    />

    <!-- Prévia visual para WhatsApp, Instagram e Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CJ Personalizados" />
    <meta
      property="og:description"
      content="Catálogo da CJ Personalizados: presentes exclusivos, papelaria personalizada e lembranças. Faça seu pedido pelo WhatsApp!"
    />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Cartões de prévia para Twitter / X com imagem em destaque -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CJ Personalizados" />
    <meta
      name="twitter:description"
      content="Catálogo da CJ Personalizados: presentes exclusivos, papelaria personalizada e lembranças. Faça seu pedido pelo WhatsApp!"
    />
    <meta name="twitter:image" content="/logo.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
